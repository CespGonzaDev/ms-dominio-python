name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Exportar OpenAPI
        run: python -m scripts.export_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_NAME: app-ms-dominio-skillgrow # ajustar al nombre real que cree P4
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar
        run: zip -r release.zip app requirements.txt -x "*/__pycache__/*"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
      - name: Smoke test /health vía APIM
        run: |
          sleep 30
          curl --fail --silent --show-error \
            -H "Ocp-Apim-Subscription-Key: ${{ secrets.APIM_SUBSCRIPTION_KEY }}" \
            "${{ secrets.APIM_BASE_URL }}/dominio/v1/health"
